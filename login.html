<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Acceso B2B — Nexify Portal</title>
  <link rel="stylesheet" href="dashboard.css"/>
</head>
<body class="login-body">

<div class="login-split">
  <!-- Formulario Limpio y Profesional -->
  <div class="login-form-side">
    <div class="login-box">
      <a href="index.html"><img src="Logo-normal.png" alt="Nexify" class="login-logo"/></a>
      
      <h1 class="login-title">Acceso al Portal</h1>
      <p class="login-subtitle">Introduce tus credenciales corporativas.</p>
      
      <form action="client-dashboard.html">
        <div class="form-group">
          <label class="form-label">Email Corporativo</label>
          <input type="email" class="form-input" placeholder="tu@empresa.com" required/>
        </div>
        
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <label class="form-label">Contraseña</label>
            <a href="#" style="font-size: 0.8rem; color: #3b82f6; text-decoration: none; font-weight: 500;">¿Has olvidado tu contraseña?</a>
          </div>
          <input type="password" class="form-input" placeholder="••••••••" required/>
        </div>
        
        <button type="submit" class="btn-login">Iniciar Sesión</button>
      </form>

      <!-- Botones Demo Rápidos -->
      <div style="margin-top: 48px; border-top: 1px solid #e5e7eb; padding-top: 24px; text-align: center;">
        <span style="font-size: 0.8rem; color: var(--g4); font-weight: 600; text-transform: uppercase;">Entornos Demo</span>
        <div style="display: flex; gap: 12px; justify-content: center; margin-top: 12px;">
          <a href="client-dashboard.html" style="font-size: 0.85rem; color: var(--dk); font-weight: 600; background: #f3f4f6; padding: 6px 12px; border-radius: 6px;">Portal Cliente</a>
          <a href="admin-dashboard.html" style="font-size: 0.85rem; color: var(--dk); font-weight: 600; background: #f3f4f6; padding: 6px 12px; border-radius: 6px;">Portal Agencia</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Branding Visual Premium -->
  <div class="login-visual-side">
    <div class="premium-grid"></div>
    <div class="premium-brand-box">
      <div class="premium-brand-title">NEXIFY<br/>STUDIO</div>
      <div class="premium-brand-subtitle">Performance Interactive Portal</div>
    </div>
  </div>
</div>

</body>
</html>
